name: canary

on:
  schedule:
    - cron: "41 6 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

jobs:
  # A real run: one keyword search for 100 ads — the 30 the page embeds and
  # at least 7 scroll batches, so scrolling is exercised every day — through
  # a residential proxy, with a local Playwright Chromium. A GitHub runner
  # is a datacentre address, and how the library answers one has not been
  # measured; so without the FACEBOOK_PROXY secret this job SKIPS with a
  # notice rather than risk going red every day for the address's sake.
  #
  # `vars.FACEBOOK_CANARY_QUERY` / `vars.FACEBOOK_CANARY_REGION` override
  # the search (default nike / US: ~24,000 results on 2026-10-06).
  # Blocked, empty, stalled, partial and remote-error outcomes are red.
  canary:
    runs-on: ubuntu-latest
    env:
      HAS_PROXY: ${{ secrets.FACEBOOK_PROXY != '' }}
      CANARY_QUERY: ${{ vars.FACEBOOK_CANARY_QUERY || 'nike' }}
      CANARY_REGION: ${{ vars.FACEBOOK_CANARY_REGION || 'US' }}
      FACEBOOK_PROXY: ${{ secrets.FACEBOOK_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — no FACEBOOK_PROXY secret configured
        if: env.HAS_PROXY != 'true'
        run: |
          echo "::notice::Skipping: no FACEBOOK_PROXY secret. Set it (a residential \
          http://login:password@host:port proxy) as a repo secret to turn the canary on. \
          This is a SKIP, not a pass or a fail."

      - uses: actions/setup-python@v5
        if: env.HAS_PROXY == 'true'
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        if: env.HAS_PROXY == 'true'
        run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      # The proxy reaches the scraper through the environment only, never
      # argv (env_config.py reads FACEBOOK_PROXY).
      - name: One search, 100 ads
        if: env.HAS_PROXY == 'true'
        run: |
          set +e
          python3 playwright_scraper.py --query "$CANARY_QUERY" --region "$CANARY_REGION" \
            --max-results 100 --format json --out canary.json --dump-html
          echo "canary_exit=$?" >> "$GITHUB_ENV"

      - name: Require a complete run with full rows
        if: env.HAS_PROXY == 'true'
        run: |
          python3 -c "
          import json, os
          code = int(os.environ['canary_exit'])
          print(f'exit {code}')
          if code != 0:
              raise SystemExit(f'canary requires EXIT_OK=0, got {code}')
          meta = json.load(open('canary.json.meta.json'))
          print(json.dumps(meta, indent=2))
          s = meta['searches'][0]
          assert meta['status'] == 'complete' and s['stop'] == 'limit' and s['scrolls'] >= 7, meta
          assert meta['total_results'] and meta['total_results'] > 1000, meta
          rows = json.load(open('canary.json'))
          assert len(rows) == 100 and len({r['sku'] for r in rows}) == 100, len(rows)
          # Scroll batches are what a regression to the first page alone loses.
          assert max(r['page'] for r in rows) >= 7, sorted({r['page'] for r in rows})
          assert [r['position'] for r in rows] == list(range(1, 101))
          for r in rows:
              assert r['sku'] == 'facebook-ad-' + r['ad_id'] and r['ad_id'].isdigit(), r
              assert r['advertiser_name'] and r['advertiser_page_id'] and r['first_shown_at'], r
              assert r['display_format'] and r['platforms_json'] and r['region'] == os.environ['CANARY_REGION'], r
              for k, v in r.items():
                  assert k == 'link_url' or not (isinstance(v, str) and '{{' in v), (k, v)
          share = sum(1 for r in rows if r['advertiser_likes']) / len(rows)
          assert share >= 0.9, f'advertiser_likes on only {share:.0%} of rows'
          print('canary: OK')
          "

      - name: Upload artifacts on every non-skipped run
        if: always() && env.HAS_PROXY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_id }}
          path: |
            canary*.json
            canary_debug_*.html
          retention-days: 14
