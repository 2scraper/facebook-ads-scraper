name: Claude Code Review

# Automated first-pass review on every PR. Extra to the family core
# — same token-guard and stable-channel reasoning as
# claude.yml, see the comments there.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check token is configured
        id: token_check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI (stable channel)
        if: steps.token_check.outputs.has_token == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "CLAUDE_CODE_PATH=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        if: steps.token_check.outputs.has_token == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ env.CLAUDE_CODE_PATH }}
          prompt: |
            Review this PR against the repository's invariants — do not
            re-litigate them, explain instead of complying if a change seems
            to conflict with one:
            - exit codes: 0 complete, 1 crash, 2 bad usage, 3 blocked,
              4 genuinely empty, 5 nothing could be read, 6 partial;
            - a run that collects nothing writes neither output nor sidecar,
              so a previous good file is never replaced by an empty one;
            - credentials never reach argv, logs or exception messages;
            - the row schema (output_writer.Product) keeps its field order;
            - 2Captcha's remote browser is always named "2Captcha Scraping
              Browser API" (the suite's banned-wording check lists the
              names it must never be given).
            Flag anything that touches the search loop or captcha handling
            without the corresponding smoke_test.py coverage.
